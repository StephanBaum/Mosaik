[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# The fuzz crates have their own workspaces (nightly-only, cargo-fuzz layout).
exclude = ["crates/core/fuzz", "crates/vault/fuzz", "crates/generator/fuzz", "crates/totp/fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/StephanBaum/Mosaik"

[workspace.dependencies]
# Crypto: only crates listed in docs/CRYPTO_SPEC.md §2.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
aead-stream = { version = "=0.6.0", default-features = false, features = ["alloc"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc", "zeroize_derive"] }
subtle = { version = "=2.6.1", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
unicode-normalization = { version = "=0.1.26", default-features = false }
thiserror = { version = "=2.0.21", default-features = false }
# M2 model (serde_json also reads the generator's vendored password-rules.json)
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "float_roundtrip"] }
base64ct = { version = "=1.8.3", default-features = false }
# M2 totp
# HMAC for HOTP/TOTP (CRYPTO_SPEC §2 "OTP"); already in the tree through hkdf.
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
# SHA-1 for HMAC-SHA-1, the RFC 4226 default (CRYPTO_SPEC §2 "OTP").
sha1 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
# Dev
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
hex-literal = "=1.1.0"
# M2 store
# SQLite with the amalgamation compiled in (no system libsqlite3 version drift).
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
# Dev-only: temporary directories for file-backed store tests.
tempfile = { version = "=3.27.0", default-features = false }
# M3 desktop (ADR-0019). Tauri without default features: no dynamic ACL, no
# D-Bus portal, no tray, no devtools in release builds, and no Common
# Controls v6 (native menus and dialogs, unused; without it `cargo test` runs
# on Windows, where test binaries carry no app manifest).
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "x11"] }
tauri-build = { version = "=2.7.4", default-features = false, features = ["config-json"] }
# Focus the running instance instead of opening a second store session.
tauri-plugin-single-instance = { version = "=2.5.4", default-features = false }
# M3 sshagent
# OpenSSH key parsing, passphrase decryption and Ed25519 / ECDSA P-256 signing
# for the SSH agent (RustCrypto; proposed ADR, CRYPTO_SPEC §2 "SSH agent").
# The 0.7 release candidate on purpose: the stable 0.6.7 pulls p256 0.13 ->
# crypto-bigint 0.5, which carries RUSTSEC-2026-0387 (timing leaks, fixed only
# in 0.7.6); every crate below ssh-key here is a release (p256 0.14.0,
# ed25519-dalek 3.0.0, crypto-bigint 0.7.10, ssh-cipher 0.3.0). No `rsa`
# feature: the `rsa` crate carries the unpatched RUSTSEC-2023-0071.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "p256", "encryption"] }
# Not used directly: ssh-key builds ed25519-dalek without default features, so
# this turns on `zeroize` (the temporary SigningKey of every Ed25519 signature
# is wiped on drop). Same version ssh-key resolves to.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
# Not used directly: ssh-key builds bcrypt-pbkdf with `alloc` only, so this
# turns on `zeroize` (the SHA-512 of the key passphrase inside bcrypt-pbkdf
# is wiped on drop). Same version ssh-key resolves to.
bcrypt-pbkdf = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# Dev-only: builds the RFC 6979 P-256 test key for the agent's known-answer
# test. Same version ssh-key resolves to.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
# Dev-only: the `Verifier` trait to check the agent's signatures with
# ssh-key. Same version ssh-key resolves to.
signature = { version = "=3.0.0", default-features = false }
# Async listener (Unix socket, Windows named pipe), timers and channels for the
# agent; already in the tree through Tauri.
tokio = { version = "=1.54.1", default-features = false, features = ["net", "rt", "sync", "time", "io-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
# cargo-fuzz builds with `--cfg fuzzing` (crates/core/fuzz).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Secret-handling hygiene: no panicking shortcuts or debug output in library code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
module_name_repetitions = "allow"

# Crypto primitives are unusably slow without optimization (Argon2id with
# 128 MiB would take minutes in a debug build). Optimize them in dev/test
# builds too; this does not change behavior, only speed.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
# Abort instead of unwinding: no unwinding through secret-holding frames and
# no panic payloads crossing FFI boundaries.
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"
