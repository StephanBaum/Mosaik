[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# The fuzz crates have their own workspaces (nightly-only, cargo-fuzz layout).
exclude = ["crates/core/fuzz", "crates/vault/fuzz", "crates/generator/fuzz", "crates/totp/fuzz", "crates/qr/fuzz", "crates/insights/fuzz", "crates/import/fuzz", "crates/ssh-agent/fuzz", "crates/native-messaging/fuzz", "crates/passkey/fuzz", "crates/sync/fuzz", "crates/server/fuzz", "apps/desktop/src-tauri/fuzz", "vendor/rqrr"]

# rqrr 0.11.0 with a bound on QR grouping work (vendor/rqrr/MOSAIC_PATCH.md, ADR-0031).
[patch.crates-io]
rqrr = { path = "vendor/rqrr" }

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/StephanBaum/Mosaik"

[workspace.dependencies]
# Crypto: only crates listed in docs/CRYPTO_SPEC.md §2.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
aead-stream = { version = "=0.6.0", default-features = false, features = ["alloc"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc", "zeroize_derive"] }
subtle = { version = "=2.6.1", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
# M6b sharing: HPKE (RFC 9180) mode Auth, DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, ChaCha20-Poly1305
# for vault-key shares and emergency seals (CRYPTO_SPEC §2, §8.2; ADR-0049). Default features
# (getrandom, mlkem, ...) are off: the ephemeral key comes from mosaic-core's own RNG.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
unicode-normalization = { version = "=0.1.26", default-features = false }
thiserror = { version = "=2.0.21", default-features = false }
# M2 model (serde_json also reads the generator's vendored password-rules.json)
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "float_roundtrip", "raw_value"] }
base64ct = { version = "=1.8.3", default-features = false }
# M2 totp
# HMAC for HOTP/TOTP (CRYPTO_SPEC §2 "OTP"); already in the tree through hkdf.
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
# SHA-1 for HMAC-SHA-1, the RFC 4226 default (CRYPTO_SPEC §2 "OTP").
sha1 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
# Dev
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
hex-literal = "=1.1.0"
# M2 store
# SQLite with the amalgamation compiled in (no system libsqlite3 version drift).
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
# Dev-only: temporary directories for file-backed store tests.
tempfile = { version = "=3.27.0", default-features = false }
# M3 desktop (ADR-0019). Tauri without default features: no dynamic ACL, no
# D-Bus portal, no tray, no devtools in release builds, and no Common
# Controls v6 (native menus and dialogs, unused; without it `cargo test` runs
# on Windows, where test binaries carry no app manifest).
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "x11"] }
tauri-build = { version = "=2.7.4", default-features = false, features = ["config-json"] }
# Focus the running instance instead of opening a second store session.
tauri-plugin-single-instance = { version = "=2.5.4", default-features = false }
# M3 shell
# Clipboard written from Rust, with the OS history/monitoring exclusions on
# Windows, macOS and Linux (maintained by 1Password); text, and image reads for
# pasted QR screenshots (mosaic-desktop enables `image-data`).
arboard = { version = "=3.7.0", default-features = false }
# The Secret Key in the OS keystore (Windows Credential Manager, macOS
# Keychain, Linux kernel keyring); no Secret Service transport crypto.
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
# Global shortcut for the quick-search window, registered from Rust only
# (no JavaScript permission is granted).
tauri-plugin-global-shortcut = { version = "=2.4.1", default-features = false }
# Native save dialog for the Emergency Kit, opened from Rust. The backend of
# tauri-plugin-dialog, used directly: the plugin forces Common Controls v6,
# which breaks `cargo test` on Windows (ADR-0019).
rfd = { version = "=0.16.1", default-features = false, features = ["gtk3"] }
# Emergency Kit PDF: a small low-level PDF writer (typst), base-14 fonts only.
pdf-writer = { version = "=0.15.0", default-features = false }
# Windows Hello (KeyCredentialManager) for quick unlock; the version Tauri's
# tree already carries, WinRT projections only.
windows = { version = "=0.62.2", default-features = false, features = ["std", "Foundation", "Foundation_Collections", "System_UserProfile", "Security_Credentials", "Security_Cryptography", "Storage_Streams"] }
# macOS Touch ID quick unlock (ADR-0028): Secure Enclave key + ECIES, safe API;
# both already in the tree through keyring's apple-native backend.
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }
security-framework-sys = { version = "=2.17.0", default-features = false, features = ["OSX_10_15"] }
# logind and screen-saver signals on Linux (auto-lock on sleep and screen
# lock); already in the tree through tauri-plugin-single-instance.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# M3 import
# Reading KeePass KDBX 4 files (mosaic-import only, never for Mosaic's own
# data; ADR draft "KDBX import primitives"): AES-256-CBC outer cipher and
# AES-KDF, ChaCha20 outer cipher and inner stream, Salsa20 inner stream.
aes = { version = "=0.9.3", default-features = false, features = ["zeroize"] }
cbc = { version = "=0.2.1", default-features = false, features = ["block-padding", "zeroize"] }
chacha20 = { version = "=0.10.2", default-features = false, features = ["cipher", "zeroize"] }
salsa20 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
# gzip (KDBX payload) and deflate (1PUX zip entries); already in the tree.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# KDBX inner XML; already in the tree (through plist).
quick-xml = { version = "=0.42.0", default-features = false }
# 1Password 1PUX archives: deflate only, no encryption, no other codecs.
zip = { version = "=9.1.2", default-features = false, features = ["deflate-flate2"] }
# M4 browser extension (ADR-0035, ADR-0036, ADR-0037)
# Public suffix list compiled in (MIT/Apache-2.0, no_std), for opt-in eTLD+1 matching.
psl = { version = "=2.1.248", default-features = false, features = ["helpers"] }
# WHATWG URL parsing, identical to the browser's origin rules; already in the tree through Tauri.
url = { version = "=2.5.8", default-features = false, features = ["std"] }
# IDNA to-Unicode for the lookalike and IDN warnings; already in the tree through url.
idna = { version = "=1.1.0", default-features = false, features = ["std", "compiled_data"] }
# M3 sshagent
# OpenSSH key parsing, passphrase decryption and Ed25519 / ECDSA P-256 signing
# for the SSH agent (RustCrypto; proposed ADR, CRYPTO_SPEC §2 "SSH agent").
# The 0.7 release candidate on purpose: the stable 0.6.7 pulls p256 0.13 ->
# crypto-bigint 0.5, which carries RUSTSEC-2026-0387 (timing leaks, fixed only
# in 0.7.6); every crate below ssh-key here is a release (p256 0.14.0,
# ed25519-dalek 3.0.0, crypto-bigint 0.7.10, ssh-cipher 0.3.0). No `rsa`
# feature: the `rsa` crate carries the unpatched RUSTSEC-2023-0071.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "p256", "encryption"] }
# Not used directly: ssh-key builds ed25519-dalek without default features, so
# this turns on `zeroize` (the temporary SigningKey of every Ed25519 signature
# is wiped on drop). Same version ssh-key resolves to.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
# Not used directly: ssh-key builds bcrypt-pbkdf with `alloc` only, so this
# turns on `zeroize` (the SHA-512 of the key passphrase inside bcrypt-pbkdf
# is wiped on drop). Same version ssh-key resolves to.
bcrypt-pbkdf = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# ECDSA P-256 (ES256) for passkeys (ADR-0039, CRYPTO_SPEC §16) and the SSH agent's
# known-answer test. Same version ssh-key resolves to. The `pkcs8` feature adds
# the PKCS#8 / SPKI encodings (RustCrypto `pkcs8`, `spki`; no new primitive).
p256 = { version = "=0.14.0", default-features = false, features = ["alloc", "ecdsa", "pkcs8"] }
# Dev-only: the `Verifier` trait to check the agent's signatures with
# ssh-key. Same version ssh-key resolves to.
signature = { version = "=3.0.0", default-features = false }
# Async listener (Unix socket, Windows named pipe), timers and channels for the
# agent; already in the tree through Tauri.
tokio = { version = "=1.54.1", default-features = false, features = ["net", "rt", "sync", "time", "io-util", "io-std"] }
# OTP setup (ADR-0031)
# Pure-Rust QR decoder (quirc port) for 2FA setup codes; no image feature (we feed luma).
rqrr = { version = "=0.11.0", default-features = false }
# PNG and JPEG (zune-jpeg) decoding with Limits for QR screenshots; arboard's
# image-data feature pulls the same crate.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# JPEG decoded straight from the borrowed plaintext (no input copy, zeroizing output);
# both are already in the tree through image.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
# Windows "Scan screen": GDI capture of the virtual screen; depends only on windows 0.62.2.
win-screenshot = { version = "=4.0.14", default-features = false }
# X11 "Scan screen": GetImage of the root window; already in the tree via arboard.
x11rb = { version = "=0.13.2", default-features = false }
# Test-only QR encoder for generated scan fixtures (zero dependencies).
qrcodegen = "=1.8.0"
# M6 sync server (ADR-0044, ADR-0046)
# OPAQUE (RFC 9807) for the sync account login; CRYPTO_SPEC section 9, ADR-0046.
# Meta-maintained, NCC Group audited. Exact pin of the latest stable 4.x release
# (4.1 is still a pre-release); default features off, ristretto255 only.
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255"] }
# opaque-ke 4.0 is written against the digest 0.10 generation, so its SHA-512
# comes from sha2 0.10 (already in the tree through other crates).
sha2_0_10 = { package = "sha2", version = "=0.10.9", default-features = false }
# HTTP server for the sync server; no JSON/form extractors (bodies are parsed
# with mosaic-sync::wire::json, which rejects unknown keys).
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "matched-path", "query"] }
# Request body limit and timeout layers; already in the tree through Tauri.
tower-http = { version = "=0.6.11", default-features = false, features = ["limit", "timeout", "catch-panic"] }
# `ServiceExt::oneshot` for the in-process API tests.
tower = { version = "=0.5.3", default-features = false, features = ["util", "limit"] }
# HTTP client of the sync transport (ADR-0046): blocking, rustls without a bundled
# crypto provider (the ring provider and the TLS 1.3 only config are set in
# mosaic-sync::http). Already in the tree through Tauri, which uses no TLS.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
# rustls with the ring provider (no aws-lc C build); no `tls12` feature of our own (hyper-rustls
# switches it on in the tree): the sync client config offers TLS 1.3 only whatever the features say.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
# The OS trust store for the sync client (ADR-0046).
rustls-platform-verifier = "=0.7.0"
# Server config file (TOML), strict (`deny_unknown_fields`).
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde"] }
# Structured logs of the server (method, route, status, duration; never bodies).
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }

# M9 WebAuthn relying party (ADR-0078): the sync server only, behind crates/server/src/auth/webauthn.rs.
passkey-auth = { version = "=0.1.3", default-features = false }

# M8 CLI (ADR-0074)
# Argv tokenizer for the `mosaic` CLI: zero dependencies, handles `--x=y`, `--` and non-UTF-8 arguments (clap rejected for size).
lexopt = "=0.3.2"
# No-echo prompts on the controlling terminal (`/dev/tty`, `CONIN$`) for the CLI's secrets; its buffers are not wiped (THREAT_MODEL R109).
rpassword = "=7.4.0"

# Ctrl-C handler of the CLI: restores the terminal mode and exits 130 (safe API, no unsafe in our code).
ctrlc = "=3.5.2"
# Saves and restores the terminal mode (echo) around a no-echo prompt on Unix; safe termios API, already in the tree.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "termios", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
# cargo-fuzz builds with `--cfg fuzzing` (crates/core/fuzz).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Secret-handling hygiene: no panicking shortcuts or debug output in library code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
module_name_repetitions = "allow"
# Suppressions are #[expect(..., reason = "...")], so a stale one is reported.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
# Size and shape of functions (thresholds in clippy.toml).
cognitive_complexity = "warn"
excessive_nesting = "warn"

# Debug info: file:line backtraces for our own code, none for dependencies.
# Full debug info for ~400 dependencies made target/ several GB and slowed linking.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# Crypto primitives are unusably slow without optimization (Argon2id with
# 128 MiB would take minutes in a debug build). Optimize them in dev/test
# builds too; this does not change behavior, only speed.
# OPAQUE (ristretto255) in the server tests: tens of group operations per login.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# QR detection on screen-sized frames is unusably slow unoptimized (ADR-0031).
[profile.dev.package.rqrr]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3

[profile.release]
# Abort instead of unwinding: no unwinding through secret-holding frames and
# no panic payloads crossing FFI boundaries.
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"
