version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
  # Each fuzz crate is its own workspace with its own lockfile; keep them
  # on the same versions as the main lockfile.
  - package-ecosystem: cargo
    directories:
      - /crates/cli/fuzz
      - /crates/core/fuzz
      - /crates/generator/fuzz
      - /crates/import/fuzz
      - /crates/insights/fuzz
      - /crates/native-messaging/fuzz
      - /crates/origin/fuzz
      - /crates/passkey/fuzz
      - /crates/qr/fuzz
      - /crates/server/fuzz
      - /crates/ssh-agent/fuzz
      - /crates/sync/fuzz
      - /crates/totp/fuzz
      - /crates/vault/fuzz
      - /apps/desktop/src-tauri/fuzz
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      fuzz-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 4
    groups:
      npm-dev-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]
      npm-prod-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # Typings track the supported Node line (engines: >=22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x supports TypeScript < 6.1 (ADR-0006).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
  # The Android app (M10). Swift has no packages: dependency verification and the allowlist
  # (scripts/mobile/check-android-deps.sh) still gate every update.
  - package-ecosystem: gradle
    directory: /apps/mobile/android
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      android-gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
