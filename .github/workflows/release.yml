name: Release

# Signed release pipeline (M9 T9; ADR-0081, ADR-0082, ADR-0086; CRYPTO_SPEC section 17; the owner's
# steps are in docs/RELEASE.md and the user's checks in docs/VERIFY.md).
#
# Two ways in:
#   - a `v*` tag: a real release. Every signing job runs in the GitHub environment `release`
#     (the owner is the required reviewer). A tag run without the minisign secrets FAILS; it never
#     turns into a dry run.
#   - a manual run with `dry_run` (the default): builds everything that can be built without
#     secrets, signs with an ephemeral key, names the signature SHA256SUMS.DRY-RUN.minisig,
#     publishes nothing and uploads no Actions artifacts. No environment, so no secrets.
#
# Android: the `android` job builds the release APK (the same Rust library steps and release checks
# as mobile.yml: no Cargo features, no test hooks) and signs it with the key in the `release`
# environment (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD). None of the four set: the job skips with a warning and the release ships
# without an APK. Some but not all: it fails. A tag run compares the APK signer with the committed
# release/android-signer.sha256; a dry run signs with a key made in the job. The APK goes through
# SHA256SUMS and the minisign signature like every other file.
#
# Platform signing (Authenticode, Developer ID and notarization) runs only when its secrets are
# set; without them the builds ship unsigned (OD-M9-2, OD-M9-3, THREAT_MODEL R119). No GitHub
# provenance attestations (OD-M9-15). The image is built here and pushed only when the repository
# variable PUBLISH_IMAGE is `true` (OD-M9-10).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no secrets, ephemeral key, nothing published, no artifacts)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/stephanbaum/mosaic-server

jobs:
  prepare:
    name: Prepare (versions, features, wording, script self-test)
    runs-on: ubuntu-24.04
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ github.sha }}
      sde: ${{ steps.mode.outputs.sde }}
    steps:
      # Full history: the next steps check that the tagged commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Decide the mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            dry=false
          elif [ "$DRY_INPUT" = "true" ]; then
            dry=true
          elif [ "$REF_TYPE" = "tag" ]; then
            dry=false
          else
            echo "::error::A real release needs a v* tag. Run this workflow from a tag, or keep dry_run on."
            exit 1
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "sde=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          if [ "$dry" = true ]; then echo "::warning::DRY RUN: nothing is published, the signature is ephemeral and marked DRY-RUN"; fi
      # A real release is built from a commit that is on main (RT-release). Only admins can create v*
      # tags (tag ruleset), and this check refuses a tag on a commit that never went through the main
      # ruleset (pull request, 17 checks, signed commits).
      - name: The tagged commit is on main
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main. A release is built only from a commit that is on main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"
      - name: Versions agree with the tag
        id: version
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.dry_run }}" = true ]; then
            out="$(bash scripts/release/check-versions.sh --allow-untagged)"
          else
            out="$(bash scripts/release/check-versions.sh)"
          fi
          echo "$out"
          echo "version=$(printf '%s\n' "$out" | sed -n 's/^version=//p')" >> "$GITHUB_OUTPUT"
      - name: The public release key is in the repository
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          test -s release/minisign.pub || { echo "::error::release/minisign.pub is missing (the owner generates the key first, docs/RELEASE.md)"; exit 1; }
      - name: No Cargo features in the release build
        run: bash scripts/release/check-features.sh
      # ADR-0153: the `preview` Cargo feature makes the native host trust the dev extension ID, so it
      # must never reach a release. check-features.sh already refuses every feature flag; this step
      # names the preview feature on its own, in this workflow, the release scripts and the image build.
      - name: No preview feature in the release build
        shell: bash
        run: |
          set -euo pipefail
          # The word is split in the pattern, so this step does not match itself.
          pat='(-''-features|-''-all-features|-F)[^#]*pre''view|features[[:space:]]*[:=][^#]*pre''view'
          fail=0
          for f in .github/workflows/release.yml deploy/Dockerfile scripts/release/*.sh apps/desktop/src-tauri/tauri.release.conf.json; do
            [ -f "$f" ] || continue
            hits="$(grep -nE -- "$pat" "$f" | grep -vE '^[0-9]+:[[:space:]]*#' || true)"
            if [ -n "$hits" ]; then echo "::error file=$f::the preview feature in a release build: $hits"; fail=1; fi
          done
          # The shipped crates must not turn it on by default or through a dependency.
          if grep -nE '^default[[:space:]]*=.*pre''view' crates/native-messaging/Cargo.toml apps/desktop/src-tauri/Cargo.toml crates/cli/Cargo.toml; then fail=1; fi
          if grep -nE 'mosaic-native-messaging[^#]*features[^#]*pre''view' apps/desktop/src-tauri/Cargo.toml crates/*/Cargo.toml; then fail=1; fi
          exit "$fail"
      - name: Wording check
        run: node scripts/release/wording-check.mjs
      - name: Install minisign (pinned version, logged)
        run: bash scripts/release/install-minisign.sh
      - name: Release script self-test
        run: bash scripts/release/selftest.sh

  cli:
    name: CLI (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    # The real release uses the environment `release` (approval, secrets); a dry run uses none.
    environment: ${{ needs.prepare.outputs.dry_run == 'false' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, arch: x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, arch: x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, arch: arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, arch: x86_64 }
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.sde }}
      DRY: ${{ needs.prepare.outputs.dry_run }}
      VERSION: ${{ needs.prepare.outputs.version }}
      WIN_MODE: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.WINDOWS_SIGN_MODE || '' }}
      HAS_WIN: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.WINDOWS_SIGN_MODE != '' && secrets.WINDOWS_SIGN_MODE != 'none' }}
      HAS_APPLE: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_INSTALLER_IDENTITY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      # No build cache on a real release (M9-F4): a poisoned cache entry must not reach a job that holds
      # signing secrets. Dry runs keep it.
      - if: needs.prepare.outputs.dry_run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      # Same flags as scripts/release/repro-build.sh, so a rebuilder's Linux binary can match ours.
      - name: Reproducible flags (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/mosaic --remap-path-prefix=$HOME/.cargo=/cargo -C link-arg=-Wl,--build-id=none" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - name: Build mosaic and mosaic-native-host
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}" -p mosaic-cli -p mosaic-native-messaging
      # ADR-0153: the built host must refuse the dev extension ID and must not name it in a manifest.
      - name: The built host does not trust the dev extension
        shell: bash
        run: |
          set -euo pipefail
          ext=""; if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          bash scripts/release/assert-host.sh "target/${{ matrix.target }}/release/mosaic-native-host$ext"
      - name: Collect the binaries
        shell: bash
        run: |
          set -euo pipefail
          ext=""; if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir -p bin out
          for b in mosaic mosaic-native-host; do
            cp "target/${{ matrix.target }}/release/$b$ext" "bin/$b$ext"
          done
      # Authenticode (Windows). Skips with a warning when WINDOWS_SIGN_MODE is not set.
      - name: Install trusted-signing-cli
        if: runner.os == 'Windows' && env.WIN_MODE == 'trusted-signing'
        run: cargo install trusted-signing-cli --version =0.11.0 --locked
      - name: Authenticode
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_MODE: ${{ env.HAS_WIN == 'true' && secrets.WINDOWS_SIGN_MODE || 'none' }}
          AZURE_TENANT_ID: ${{ env.HAS_WIN == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.HAS_WIN == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.HAS_WIN == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ env.HAS_WIN == 'true' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ env.HAS_WIN == 'true' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
          AZURE_CERT_PROFILE: ${{ env.HAS_WIN == 'true' && secrets.AZURE_CERT_PROFILE || '' }}
          WINDOWS_PFX_BASE64: ${{ env.HAS_WIN == 'true' && secrets.WINDOWS_PFX_BASE64 || '' }}
          WINDOWS_PFX_PASSWORD: ${{ env.HAS_WIN == 'true' && secrets.WINDOWS_PFX_PASSWORD || '' }}
        run: ./scripts/release/sign-windows.ps1 bin/mosaic.exe bin/mosaic-native-host.exe
      # Developer ID, hardened runtime, notarization and the .pkg (macOS). Skips with a warning without secrets.
      - name: Developer ID, notarize and build the .pkg
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash scripts/release/macos-sign-cli.sh bin out "$VERSION" "${{ matrix.arch }}"
      - name: Unsigned (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE != 'true'
        run: |
          echo "::warning::unsigned (no Apple signing secrets, or dry run): Gatekeeper will warn, no hardened runtime (R119)"
      - name: Pack the archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Path bin/mosaic.exe,bin/mosaic-native-host.exe -DestinationPath 'out/mosaic-cli-$VERSION-${{ matrix.target }}.zip'"
          else
            if [ "$RUNNER_OS" = macOS ] && ! command -v gtar > /dev/null; then brew install gnu-tar; fi
            bash scripts/release/package-cli.sh "${{ matrix.target }}" bin out
          fi
          if [ "$DRY" = true ]; then
            echo "::group::hashes (dry run: nothing is uploaded)"
            (cd bin && (sha256sum * 2>/dev/null || shasum -a 256 *))
            echo "::endgroup::"
          fi
      - name: Upload
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: out/
          retention-days: 1
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    environment: ${{ needs.prepare.outputs.dry_run == 'false' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.sde }}
      DRY: ${{ needs.prepare.outputs.dry_run }}
      VERSION: ${{ needs.prepare.outputs.version }}
      WIN_MODE: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.WINDOWS_SIGN_MODE || '' }}
      HAS_WIN: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.WINDOWS_SIGN_MODE != '' && secrets.WINDOWS_SIGN_MODE != 'none' }}
      HAS_APPLE: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' }}
      HAS_UPDATER_KEY: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Tauri v2 prerequisites, minus libssl-dev: Mosaic links no OpenSSL (deny.toml bans it).
      - name: Install Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      # No build cache on a real release (M9-F4): a poisoned cache entry must not reach a job that holds
      # signing secrets. Dry runs keep it.
      - if: needs.prepare.outputs.dry_run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-desktop-${{ matrix.target }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ needs.prepare.outputs.dry_run == 'true' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # The CLI and the native host ship inside the app (bundle.externalBin of the release overlay).
      - name: Build the sidecars
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" -p mosaic-cli -p mosaic-native-messaging
          ext=""; if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/mosaic$ext" "apps/desktop/src-tauri/binaries/mosaic-${{ matrix.target }}$ext"
          cp "target/${{ matrix.target }}/release/mosaic-native-host$ext" "apps/desktop/src-tauri/binaries/mosaic-native-host-${{ matrix.target }}$ext"
      - name: The built host does not trust the dev extension
        shell: bash
        run: |
          set -euo pipefail
          ext=""; if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          bash scripts/release/assert-host.sh "target/${{ matrix.target }}/release/mosaic-native-host$ext"
      # System native-messaging manifests, generated from the same source as install.rs (M9 T8).
      # The deb and rpm file lists read the Linux ones; the WiX fragment reads the Windows ones
      # from MOSAIC_NM_MANIFEST_DIR. macOS repairs the per-user manifests at start instead.
      - name: Generate the system manifests
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          host="target/${{ matrix.target }}/release/mosaic-native-host"
          if [ "$RUNNER_OS" = Windows ]; then
            out="apps/desktop/src-tauri/binaries/native-messaging/windows"
            "$host.exe" manifest --system --os windows --out "$out"
            echo "MOSAIC_NM_MANIFEST_DIR=$(cygpath -w "$PWD/$out")" >> "$GITHUB_ENV"
          else
            "$host" manifest --system --os linux --out apps/desktop/src-tauri/binaries/native-messaging/linux
          fi
      # Signing secrets never reach the compile, the frontend build or a build script (RT-release,
      # R118): `tauri build --no-bundle` runs with no signing variable, and only the bundle step
      # below (the one that signs) has an `env:` with them. No secret is written to GITHUB_ENV.
      # This keeps the secrets out of the build's environment only: the steps share the runner, so
      # an actively compromised build can still reach the bundle step (R118 lists what remains).
      # trusted-signing-cli is built here, before any secret is in a step environment.
      - name: Install trusted-signing-cli
        if: runner.os == 'Windows' && env.WIN_MODE == 'trusted-signing'
        run: cargo install trusted-signing-cli --version =0.11.0 --locked
      - name: Windows without a certificate
        if: runner.os == 'Windows' && env.HAS_WIN != 'true'
        run: |
          echo "::warning::unsigned (no Windows signing secrets, or dry run): SmartScreen will warn (R119)"
      - name: macOS without a certificate
        if: runner.os == 'macOS' && env.HAS_APPLE != 'true'
        run: |
          echo "::warning::unsigned (no Apple signing secrets, or dry run): Gatekeeper will warn, no hardened runtime (R119)"
      # The build never sees the updater key or any platform signing secret (M9-F4): Tauri would sign
      # inside this step, next to every build script and dependency. It compiles and builds the
      # frontend only; the bundles are made, and signed, by the bundle step after it.
      - name: Build the app (no bundles, no signing secrets)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @mosaic/desktop tauri build --no-bundle --target "${{ matrix.target }}" \
            --config src-tauri/tauri.release.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # Bundle and sign. Three steps with one command, so that a signing secret is in the environment
      # of exactly the step that uses it and an unsigned build sees none of these variables.
      - name: Bundle and sign (Windows)
        if: runner.os == 'Windows' && env.HAS_WIN == 'true'
        shell: bash
        env:
          MOSAIC_UNSIGNED_HASHES: ${{ runner.temp }}/unsigned-hashes.txt
          WINDOWS_SIGN_MODE: ${{ secrets.WINDOWS_SIGN_MODE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          # An empty secret is not set at all (the mode only needs its own variables).
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT AZURE_CERT_PROFILE WINDOWS_PFX_BASE64 WINDOWS_PFX_PASSWORD; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          pnpm --filter @mosaic/desktop tauri bundle --target "${{ matrix.target }}" \
            --config src-tauri/tauri.release.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle and sign (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        env:
          MOSAIC_UNSIGNED_HASHES: ${{ runner.temp }}/unsigned-hashes.txt
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          trap 'rm -f "$key"' EXIT
          export APPLE_API_KEY_PATH="$key"
          unset APPLE_API_KEY_P8
          pnpm --filter @mosaic/desktop tauri bundle --target "${{ matrix.target }}" \
            --config src-tauri/tauri.release.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle (unsigned)
        if: ${{ !((runner.os == 'Windows' && env.HAS_WIN == 'true') || (runner.os == 'macOS' && env.HAS_APPLE == 'true')) }}
        shell: bash
        env:
          MOSAIC_UNSIGNED_HASHES: ${{ runner.temp }}/unsigned-hashes.txt
        run: |
          set -euo pipefail
          pnpm --filter @mosaic/desktop tauri bundle --target "${{ matrix.target }}" \
            --config src-tauri/tauri.release.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # Only this step holds the updater key. It signs the finished artifacts (the Authenticode-signed
      # MSI, and the macOS app archive made here) with `tauri signer sign`; deb and rpm have none.
      - name: Sign the updater artifacts
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          if [ "$RUNNER_OS" = macOS ]; then
            app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)"
            tar -czf "$app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
          fi
          signed=0
          for f in "$bundle"/msi/*.msi "$bundle"/macos/*.app.tar.gz; do
            [ -f "$f" ] || continue
            pnpm --filter @mosaic/desktop exec tauri signer sign "$f"
            test -s "$f.sig"
            signed=$((signed + 1))
          done
          if [ "$RUNNER_OS" != Linux ]; then test "$signed" -ge 1 || { echo "::error::no updater artifact was signed"; exit 1; }; fi
      - name: No updater key
        if: env.HAS_UPDATER_KEY != 'true'
        run: 'echo "::warning::no updater key, so the .sig files are not built"'
      - name: Collect the bundles and the pre-signing hashes
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          find "$bundle" -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} out/ \;
          if [ "$RUNNER_OS" = macOS ]; then
            app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)"
            ditto -c -k --keepParent "$app" "out/Mosaic-$VERSION-${{ matrix.target }}.app.zip"
          fi
          test -n "$(ls out)" || { echo "::error::the Tauri build produced no bundles"; exit 1; }
          # SHA256SUMS.unsigned (R120): the hashes before platform signing. Windows records them in
          # sign-windows.ps1; an unsigned build's final hashes are its pre-signing hashes; signed
          # macOS bundles have no pre-signing copy (documented in docs/REPRODUCIBLE_BUILDS.md).
          part="out/unsigned-part-${{ matrix.target }}.txt"
          : > "$part"
          if [ -s "$RUNNER_TEMP/unsigned-hashes.txt" ]; then
            cat "$RUNNER_TEMP/unsigned-hashes.txt" >> "$part"
          fi
          signed_here=false
          if [ "$RUNNER_OS" = Windows ] && [ "$HAS_WIN" = true ]; then signed_here=true; fi
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_APPLE" = true ]; then signed_here=true; fi
          if [ "$signed_here" = false ]; then
            for f in out/*.msi out/*.dmg out/*.deb out/*.rpm out/*.app.zip; do
              [ -f "$f" ] || continue
              (cd out && (sha256sum "$(basename "$f")" 2>/dev/null || shasum -a 256 "$(basename "$f")")) >> "$part"
            done
          fi
          if [ "$DRY" = true ]; then
            echo "::group::hashes (dry run: nothing is uploaded)"
            (cd out && (sha256sum -- * 2>/dev/null || shasum -a 256 -- *))
            echo "::endgroup::"
          fi
      - name: Upload
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: out/
          retention-days: 1
          if-no-files-found: error

  extension:
    name: Extension zips
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.sde }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ needs.prepare.outputs.dry_run == 'true' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Build and pack
        run: bash scripts/release/package-extension.sh --build out
      - name: Hashes (dry run only, nothing is uploaded)
        if: needs.prepare.outputs.dry_run == 'true'
        run: cd out && sha256sum -- *
      - name: Upload
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: out/
          retention-days: 1
          if-no-files-found: error

  server-image:
    name: Server image (OCI tar)
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.sde }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build the image as an OCI tar (never pushed here)
        run: |
          set -euo pipefail
          docker buildx create --name mosaic-release --driver docker-container --use
          docker buildx version
          docker buildx inspect --bootstrap | sed -n 's/^BuildKit version: */BuildKit: /p;s/^ *Buildkit: */BuildKit: /p'
          mkdir -p out
          # No provenance and no SBOM attestation (OD-M9-15): one manifest, one digest.
          docker buildx build -f deploy/Dockerfile \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --provenance=false --sbom=false \
            --output "type=oci,dest=out/mosaic-server-$VERSION-oci.tar,rewrite-timestamp=true" .
          digest="$(tar -xOf "out/mosaic-server-$VERSION-oci.tar" index.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s).manifests;if(m.length!==1)process.exit(1);process.stdout.write(m[0].digest)})')"
          case "$digest" in sha256:*) ;; *) echo "::error::no single image digest in index.json"; exit 1 ;; esac
          printf '%s@%s\n' "$IMAGE_NAME" "$digest" > out/mosaic-server-image.ref
          echo "image: $(cat out/mosaic-server-image.ref)"
      - name: Upload
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image
          path: out/
          retention-days: 1
          if-no-files-found: error

  sbom:
    name: SBOMs (Rust and JS)
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.sde }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      # No build cache on a real release (M9-F4): a poisoned cache entry must not reach a job that holds
      # signing secrets. Dry runs keep it.
      - if: needs.prepare.outputs.dry_run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ needs.prepare.outputs.dry_run == 'true' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Rust SBOMs (CycloneDX 1.5)
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sbom
          mkdir -p out
          cp crates/cli/sbom.json out/mosaic.cdx.json
          cp crates/server/sbom.json out/mosaic-server.cdx.json
          cp apps/desktop/src-tauri/sbom.json out/mosaic-desktop.cdx.json
          cp crates/native-messaging/sbom.json out/mosaic-native-host.cdx.json
          node scripts/release/sbom-js.mjs normalize out/mosaic.cdx.json out/mosaic-server.cdx.json out/mosaic-desktop.cdx.json out/mosaic-native-host.cdx.json
      - name: JS SBOMs
        run: |
          set -euo pipefail
          node scripts/release/sbom-js.mjs --package apps/extension --out out/mosaic-extension.cdx.json
          node scripts/release/sbom-js.mjs --package apps/desktop --out out/mosaic-desktop-frontend.cdx.json
      - name: Upload
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: out/
          retention-days: 1
          if-no-files-found: error

  # Two builds in two different directories must give identical bytes: the Linux CLI and host,
  # the server binary, the OCI image, and both extension zips (ADR-0086).
  reproducibility:
    name: Reproducibility (build twice, compare)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.sde }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Export the sources twice, into differently named directories
        run: |
          set -euo pipefail
          for d in "$RUNNER_TEMP/first/mosaic-one" "$RUNNER_TEMP/second/another-name"; do
            mkdir -p "$d"
            git archive HEAD | tar -x -C "$d"
          done
      - name: Build 1
        run: bash "$RUNNER_TEMP/first/mosaic-one/scripts/release/repro-build.sh" "$RUNNER_TEMP/first/mosaic-one" "$RUNNER_TEMP/first/out"
      - name: Build 2
        run: bash "$RUNNER_TEMP/second/another-name/scripts/release/repro-build.sh" "$RUNNER_TEMP/second/another-name" "$RUNNER_TEMP/second/out"
      - name: Compare the binaries, archives and zips
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/first/out/SHA256SUMS.repro"
          diff -u "$RUNNER_TEMP/first/out/SHA256SUMS.repro" "$RUNNER_TEMP/second/out/SHA256SUMS.repro" \
            || { echo "::error::the two builds differ (see the diff above, docs/REPRODUCIBLE_BUILDS.md)"; exit 1; }
      - name: Build the image twice without cache and compare
        run: |
          set -euo pipefail
          docker buildx create --name mosaic-repro --driver docker-container --use
          for v in first/mosaic-one second/another-name; do
            docker buildx build --no-cache -f "$RUNNER_TEMP/$v/deploy/Dockerfile" \
              --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" --provenance=false --sbom=false \
              --output "type=oci,dest=$RUNNER_TEMP/$(dirname "$v").oci.tar,rewrite-timestamp=true" "$RUNNER_TEMP/$v"
          done
          a="$(sha256sum "$RUNNER_TEMP/first.oci.tar" | cut -d' ' -f1)"
          b="$(sha256sum "$RUNNER_TEMP/second.oci.tar" | cut -d' ' -f1)"
          echo "image tar 1: $a"
          echo "image tar 2: $b"
          [ "$a" = "$b" ] || { echo "::error::the two image builds differ"; exit 1; }
          # The report that goes into the release.
          { cat "$RUNNER_TEMP/first/out/SHA256SUMS.repro"; echo "$a  image-oci-tar (built without cache from two directories)"; } > "$RUNNER_TEMP/reproducibility-report.txt"
      - name: Upload the report
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducibility
          path: ${{ runner.temp }}/reproducibility-report.txt
          retention-days: 1
          if-no-files-found: error

  android:
    name: Android (release APK)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # A tag run uses the environment `release` (approval, the ANDROID_* secrets); a dry run uses none.
    environment: ${{ needs.prepare.outputs.dry_run == 'false' && 'release' || '' }}
    env:
      DRY: ${{ needs.prepare.outputs.dry_run }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ANDROID_NDK_VERSION: "29.0.14206865"
      ANDROID_COMPILE_SDK: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Same all-or-nothing rule as the platform signing groups: none of the four set skips the job with
      # a warning (no APK in the release); some but not all fails it. A dry run signs with a key made
      # in this job.
      - name: Decide whether to build and how to sign
        id: mode
        shell: bash
        env:
          S_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S_STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          S_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$DRY" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DRY RUN: the APK is signed with a key made in this job and is not uploaded"
            exit 0
          fi
          n=0
          for v in "$S_KEYSTORE" "$S_STOREPASS" "$S_ALIAS" "$S_KEYPASS"; do [ -z "$v" ] || n=$((n + 1)); done
          if [ "$n" -eq 0 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_* signing secrets are set in the environment 'release': this release ships WITHOUT an Android APK (docs/RELEASE.md, Android setup)."
            exit 0
          fi
          if [ "$n" -ne 4 ]; then
            echo "::error::Only $n of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are set in the environment 'release'. Set all four, or none."
            exit 1
          fi
          # Fail before the long build: the owner commits the signer fingerprint in setup.
          if [ ! -s release/android-signer.sha256 ]; then
            echo "::error::release/android-signer.sha256 is missing. The owner creates the Android keystore and commits its signer SHA-256 there first (docs/RELEASE.md, Android setup)."
            exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
      - name: Install toolchain from rust-toolchain.toml
        if: steps.mode.outputs.build == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add the Android Rust targets (CI only)
        if: steps.mode.outputs.build == 'true'
        run: rustup target add aarch64-linux-android x86_64-linux-android
      # No build cache on a real release (M9-F4): a poisoned cache entry must not reach a job that holds
      # the signing key. Dry runs keep it.
      - if: steps.mode.outputs.build == 'true' && needs.prepare.outputs.dry_run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: release-android }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.mode.outputs.build == 'true'
        with: { distribution: temurin, java-version: "21" }
      - name: Install the Android SDK parts and the NDK
        if: steps.mode.outputs.build == 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        if: steps.mode.outputs.build == 'true'
        run: command -v cargo-ndk || cargo install cargo-ndk --version "=${CARGO_NDK_VERSION}" --locked
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.mode.outputs.build == 'true'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.mode.outputs.build == 'true'
        with:
          cache-disabled: ${{ needs.prepare.outputs.dry_run == 'false' }}
      # The same release checks as mobile.yml's "Android release check": no Cargo features, no test hooks.
      - name: Build the release libraries (no features)
        if: steps.mode.outputs.build == 'true'
        run: bash scripts/mobile/build-android-native.sh release
      - name: No test hooks in the release libraries
        if: steps.mode.outputs.build == 'true'
        run: |
          set -euo pipefail
          for lib in apps/mobile/android/core/src/main/jniLibs/*/libmosaic_mobile_ffi.so; do
            bash scripts/mobile/check-no-test-hooks.sh "$lib"
          done
      - name: Generate the Kotlin bindings (no features, so no MosaicTestHooks)
        if: steps.mode.outputs.build == 'true'
        run: bash scripts/mobile/bindgen.sh --out apps/mobile/android/core/build/generated/uniffi kotlin
      # Real release: the keystore comes from the environment secret and lives in RUNNER_TEMP only.
      # Dry run: a throwaway key with a random password (as in preview.yml). Nothing here is printed.
      - name: Prepare the keystore
        if: steps.mode.outputs.build == 'true'
        shell: bash
        env:
          S_KEYSTORE: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/mosaic-android.keystore"
          if [ "$DRY" = true ]; then
            pw="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"
            test "${#pw}" -ge 24
            echo "::add-mask::$pw"
            export EPHEMERAL_PW="$pw"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias mosaic-dry-run \
              -keyalg RSA -keysize 3072 -validity 30 -dname "CN=Mosaic dry run (throwaway key)" \
              -storepass:env EPHEMERAL_PW -keypass:env EPHEMERAL_PW > /dev/null
            echo "EPHEMERAL_PW=$pw" >> "$GITHUB_ENV"
          else
            (umask 077; printf '%s' "$S_KEYSTORE" | base64 -d > "$ks")
            test -s "$ks" || { echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore"; exit 1; }
          fi
          echo "MOSAIC_ANDROID_KEYSTORE=$ks" >> "$GITHUB_ENV"
      # The init script is the one preview.yml uses; it signs only the release build type and reads the
      # three variables (plus MOSAIC_ANDROID_KEY_PASSWORD). No keystore or password is in the repository.
      - name: Release APK
        if: steps.mode.outputs.build == 'true'
        working-directory: apps/mobile/android
        env:
          MOSAIC_ANDROID_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.ANDROID_KEYSTORE_PASSWORD || env.EPHEMERAL_PW }}
          MOSAIC_ANDROID_KEYSTORE_ALIAS: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.ANDROID_KEY_ALIAS || 'mosaic-dry-run' }}
          MOSAIC_ANDROID_KEY_PASSWORD: ${{ needs.prepare.outputs.dry_run == 'false' && secrets.ANDROID_KEY_PASSWORD || env.EPHEMERAL_PW }}
        run: ./gradlew --no-daemon --stacktrace --init-script "$GITHUB_WORKSPACE/scripts/preview/android-signing.init.gradle" :app:assembleRelease
      - name: Delete the keystore
        if: always() && steps.mode.outputs.build == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/mosaic-android.keystore"
      - name: Verify the APK (signature, signer, version, no test hooks, not debuggable)
        if: steps.mode.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apks=(apps/mobile/android/app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1 && test -f "${apks[0]}" || { echo "::error::expected one release APK"; exit 1; }
          apk="${apks[0]}"
          case "$apk" in *unsigned*) echo "::error::the APK is unsigned"; exit 1 ;; esac
          bt="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          "$bt/apksigner" verify --verbose --min-sdk-version 28 "$apk"
          certs="$("$bt/apksigner" verify --print-certs --min-sdk-version 28 "$apk")"
          # Public data (a certificate digest), printed on purpose.
          printf '%s\n' "$certs"
          [ "$(printf '%s\n' "$certs" | grep -c '^Signer #[0-9]* certificate SHA-256 digest:')" -eq 1 ] \
            || { echo "::error::the APK must have exactly one signer"; exit 1; }
          signer="$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f' | tr -d ': ')"
          printf '%s' "$signer" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::could not read the signer SHA-256"; exit 1; }
          echo "Signer SHA-256: $signer"
          if [ "$DRY" = false ]; then
            expected="$(tr 'A-F' 'a-f' < release/android-signer.sha256 | tr -d ': \r\n')"
            printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::release/android-signer.sha256 must hold one SHA-256 (64 hex digits)"; exit 1; }
            if [ "$signer" != "$expected" ]; then
              echo "::error::The APK signer ($signer) is not the committed signer ($expected). The wrong keystore is in the secret, or release/android-signer.sha256 is stale."
              exit 1
            fi
            echo "The signer matches release/android-signer.sha256"
          fi
          badging="$("$bt/aapt2" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -q "versionName='${VERSION}'" \
            || { echo "::error::the APK versionName is not ${VERSION} (apps/mobile/android/app/build.gradle.kts)"; exit 1; }
          if printf '%s\n' "$badging" | grep -q 'application-debuggable'; then echo "::error::the APK is debuggable"; exit 1; fi
          # The libraries inside the APK, not only the ones the build made: no test hooks.
          mkdir -p "$RUNNER_TEMP/apk-libs"
          unzip -q -o "$apk" 'lib/*/libmosaic_mobile_ffi.so' -d "$RUNNER_TEMP/apk-libs"
          libs=("$RUNNER_TEMP"/apk-libs/lib/*/libmosaic_mobile_ffi.so)
          test "${#libs[@]}" -ge 1 && test -f "${libs[0]}" || { echo "::error::no libmosaic_mobile_ffi.so in the APK"; exit 1; }
          for lib in "${libs[@]}"; do bash scripts/mobile/check-no-test-hooks.sh "$lib"; done
          mkdir -p out
          cp "$apk" "out/Mosaic-${VERSION}-android.apk"
          (cd out && sha256sum -- *)
      - name: Upload
        if: steps.mode.outputs.build == 'true' && needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/
          retention-days: 1
          if-no-files-found: error

  checksums-sign-verify:
    name: Checksums, signature and verification
    needs: [prepare, cli, desktop, android, extension, server-image, sbom, reproducibility]
    runs-on: ubuntu-24.04
    # Signing needs the owner's approval and the environment secrets; a dry run has neither.
    environment: ${{ needs.prepare.outputs.dry_run == 'false' && 'release' || '' }}
    env:
      DRY: ${{ needs.prepare.outputs.dry_run }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GIT_SHA: ${{ needs.prepare.outputs.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.sde }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ needs.prepare.outputs.dry_run == 'true' && 'pnpm' || '' }}
      - name: Install minisign (pinned version, logged)
        run: bash scripts/release/install-minisign.sh
      - name: A tag run needs the signing secrets
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$MINISIGN_PASSWORD" ]; then
            echo "::error::MINISIGN_SECRET_KEY and MINISIGN_PASSWORD are not set in the environment 'release'. A tag run never falls back to a dry run (docs/RELEASE.md)."
            exit 1
          fi
      # Real release: every artifact comes from the jobs above.
      - name: Download the build outputs
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-files
          merge-multiple: true
      # Dry run: no artifacts cross jobs, so build the parts that need no secrets right here.
      - name: Dry run, build the Linux CLI and the extension zips in this job
        if: needs.prepare.outputs.dry_run == 'true'
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p mosaic-cli -p mosaic-native-messaging
          mkdir -p bin release-files
          cp target/x86_64-unknown-linux-gnu/release/mosaic target/x86_64-unknown-linux-gnu/release/mosaic-native-host bin/
          bash scripts/release/package-cli.sh x86_64-unknown-linux-gnu bin release-files
          pnpm install --frozen-lockfile
          bash scripts/release/package-extension.sh --build release-files
          node scripts/release/sbom-js.mjs --package apps/extension --out release-files/mosaic-extension.cdx.json
      - name: Merge the pre-signing hashes (SHA256SUMS.unsigned) and add the image SBOM
        run: |
          set -euo pipefail
          cd release-files
          if ls unsigned-part-*.txt > /dev/null 2>&1; then
            cat unsigned-part-*.txt | LC_ALL=C sort -k2 > SHA256SUMS.unsigned
            rm -f unsigned-part-*.txt
            echo "::group::SHA256SUMS.unsigned"; cat SHA256SUMS.unsigned; echo "::endgroup::"
          fi
          cd ..
          if [ "$DRY" = false ]; then
            node scripts/release/sbom-js.mjs image --sbom release-files/mosaic-server.cdx.json \
              --dockerfile deploy/Dockerfile --image-ref "$(cat release-files/mosaic-server-image.ref)" \
              --out release-files/mosaic-server-image.cdx.json
          fi
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          bash scripts/release/checksums.sh release-files
          cat release-files/SHA256SUMS
      - name: Sign (release key)
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash scripts/release/sign.sh release-files --release
      - name: Sign (dry run, ephemeral key)
        if: needs.prepare.outputs.dry_run == 'true'
        run: |
          echo "::warning::DRY RUN: signing with an ephemeral key, the signature is named SHA256SUMS.DRY-RUN.minisig"
          bash scripts/release/sign.sh release-files --dry-run
      # The same commands docs/VERIFY.md gives the user, on our own output.
      - name: Verify the output (as a user would)
        run: |
          set -euo pipefail
          if [ "$DRY" = true ]; then
            bash scripts/release/verify.sh release-files --pubkey-file release-files/DRY-RUN-NOT-A-RELEASE-minisign.pub --version "$VERSION" --dry-run
          else
            bash scripts/release/verify.sh release-files --pubkey-file release/minisign.pub --version "$VERSION"
          fi
      - name: Upload the signed release files
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish (draft GitHub release)
    needs: [prepare, checksums-sign-verify]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GIT_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Create the draft release (a prerelease, pre-audit)
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Mosaic $VERSION. **Pre-audit: no external audit has been done.**

          Check the download before you run it: follow docs/VERIFY.md (verify \`SHA256SUMS\` with \`SHA256SUMS.minisig\` and the public key in \`release/minisign.pub\`, then the file hash).
          Builds without a platform certificate are unsigned, so Windows SmartScreen and macOS Gatekeeper warn; see docs/VERIFY.md.
          The Android APK (when present) is signed with the project's Android key: check its signer as docs/VERIFY.md describes.
          The server image is named in \`mosaic-server-image.ref\` by digest. Source commit: $GIT_SHA.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Mosaic $VERSION (pre-audit)" --notes-file notes.md release-files/*

  # Pushes the image only when the repository variable PUBLISH_IMAGE is `true` (OD-M9-10, default off).
  publish-image:
    name: Publish the image (only when PUBLISH_IMAGE is true)
    needs: [prepare, checksums-sign-verify]
    if: needs.prepare.outputs.dry_run == 'false' && vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Push the signed image by digest
        run: |
          set -euo pipefail
          ref="$(cat release-files/mosaic-server-image.ref)"
          digest="${ref#*@}"
          skopeo copy --preserve-digests --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" \
            "oci-archive:release-files/mosaic-server-$VERSION-oci.tar" "docker://$IMAGE_NAME:$VERSION"
          remote="$(skopeo inspect --creds "$REGISTRY_USER:$REGISTRY_TOKEN" --format '{{.Digest}}' "docker://$IMAGE_NAME:$VERSION")"
          [ "$remote" = "$digest" ] || { echo "::error::pushed digest $remote differs from the signed $digest"; exit 1; }
          echo "pushed $IMAGE_NAME:$VERSION at $digest"
