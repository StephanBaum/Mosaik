name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      # The desktop app needs the webview toolchain; it has its own job below.
      - run: cargo clippy --workspace --exclude mosaic-desktop --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude mosaic-desktop --locked
      # Slow-in-debug tests (the 50 MiB attachment round trip at exactly
      # MAX_ATTACHMENT_LEN, the long multi-device sync simulation) run
      # optimized.
      # The SSH agent's OpenSSH interop test (ignored, run below) needs the Windows
      # OpenSSH client, which speaks the named pipe the agent serves.
      - name: Check the OpenSSH client (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Windows\System32\OpenSSH\ssh-keygen.exe')) {
            Write-Error 'The Windows OpenSSH client is missing'; exit 1
          }
      - run: cargo test --release --locked --workspace --exclude mosaic-desktop -- --ignored

  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `mosaic` itself, as shipped (spec section 3.9). Release builds have no test backends.
      - run: cargo build -p mosaic-cli --release --locked
      # The integration tests need the `test-util` feature (file-based keystore, session store and
      # clipboard, a loopback server for the hosted flows), which is debug-only and a compile
      # error in release. Two threads: every fixture copy unlocks with the 128 MiB Argon2id cost.
      # `docs_are_current` (the committed man page and completions) is part of this run.
      - run: cargo test -p mosaic-cli --features test-util --locked -- --test-threads=2

  desktop-rust:
    name: Desktop app, Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Tauri v2 prerequisites (https://v2.tauri.app/start/prerequisites/), minus
      # libssl-dev: Mosaic links no OpenSSL (deny.toml bans it).
      - name: Install Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev             librsvg2-dev libxdo-dev
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check -p mosaic-desktop --all-targets --locked
      - run: cargo clippy -p mosaic-desktop --all-targets --locked -- -D warnings
      # Includes the contract fixture check (ADR-0018) and the command/ACL wiring test.
      - run: cargo test -p mosaic-desktop --locked

  coverage:
    name: Coverage (${{ matrix.crate }} >= 90 % lines)
    strategy:
      fail-fast: false
      matrix:
        # Brief §8: core, totp, generator and passkey. The vault crate
        # holds the M2 session and store; import and the SSH agent parse untrusted
        # input; insights rates vault passwords; origin decides which site gets a
        # fill and native-messaging frames the extension channel; sync holds the
        # wire formats of both sync backends and server is the sync server (M6).
        # All are held to the same bar.
        crate: [mosaic-core, mosaic-totp, mosaic-generator, mosaic-vault, mosaic-insights, mosaic-import, mosaic-ssh-agent, mosaic-qr, mosaic-origin, mosaic-native-messaging, mosaic-passkey, mosaic-sync, mosaic-server]
        include:
          # The folder, engine, HTTP and chaos tests of the sync crate need the
          # test utilities. The hosted engine paths are exercised by the server
          # crate's integration tests (real server on loopback), so they run
          # too; only crates/sync production files count (server files and the
          # test utilities are excluded from the report).
          - crate: mosaic-sync
            features: >-
              -p mosaic-server --features mosaic-sync/http,mosaic-sync/test-util
              --ignore-filename-regex '(crates/server/|/testutil/)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install toolchain from rust-toolchain.toml (includes llvm-tools-preview)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --locked -p ${{ matrix.crate }} ${{ matrix.features }} --summary-only --fail-under-lines 90

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.dir }}, 60 s per target)
    strategy:
      fail-fast: false
      matrix:
        dir:
          - crates/core/fuzz
          - crates/vault/fuzz
          - crates/totp/fuzz
          - crates/qr/fuzz
          - crates/generator/fuzz
          - crates/insights/fuzz
          - crates/import/fuzz
          - crates/ssh-agent/fuzz
          - crates/native-messaging/fuzz
          - crates/passkey/fuzz
          - crates/sync/fuzz
          - crates/server/fuzz
          - crates/cli/fuzz
          - crates/origin/fuzz
          # Includes the shell's contract, persist, draft and Emergency Kit modules by
          # path; no tauri, so no WebKitGTK is needed.
          - apps/desktop/src-tauri/fuzz
    runs-on: ubuntu-latest
    env:
      # Dated nightly so the job does not break when a new nightly ships.
      # Bump deliberately together with cargo-fuzz.
      FUZZ_TOOLCHAIN: nightly-2026-10-25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install pinned nightly (cargo-fuzz needs -Z sanitizer flags)
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz@0.13.2
      - name: Run every fuzz target for 60 s
        working-directory: ${{ matrix.dir }}
        env:
          RUSTFLAGS: ""
        # `seeds/<target>` (committed, minimized inputs built from the golden
        # files) is passed after the scratch corpus, so libFuzzer reads the
        # seeds but writes new inputs only to `corpus/<target>`.
        # attachment_* targets get a max_len above two 64 KiB chunks; the
        # otpauth URI and passwordrules parsers get one above their 4096-byte
        # input bounds, so the bounds themselves are exercised.
        # --target: the prebuilt cargo-fuzz binary is musl-built and would
        # otherwise default to its own host triple.
        run: |
          set -euo pipefail
          targets="$(cargo "+$FUZZ_TOOLCHAIN" fuzz list)"
          test -n "$targets"
          for t in $targets; do
            echo "::group::$t"
            test -d "seeds/$t" || { echo "::error::missing seeds/$t"; exit 1; }
            mkdir -p "corpus/$t"
            extra=""; if [ -f "dicts/$t.dict" ]; then extra="-dict=dicts/$t.dict"; fi
            case "$t" in
              attachment_*) extra="$extra -max_len=270000" ;;
              # Segments and JSON bodies are far larger than libFuzzer's default 4096.
              segment_decode|json_responses|request_bodies) extra="$extra -max_len=65536" ;;
              # The longest checkpoint upload is 65 600 bytes.
              checkpoint_upload) extra="$extra -max_len=65600" ;;
              otpauth_uri|password_rules) extra="$extra -max_len=8192" ;;
              # QR finder-pattern matching is quadratic (THREAT_MODEL R32): 10 s per input.
              scan_image) extra="$extra -max_len=1048576 -timeout=10" ;;
              scan_luma) extra="$extra -timeout=10" ;;
            esac
            cargo "+$FUZZ_TOOLCHAIN" fuzz run --target x86_64-unknown-linux-gnu "$t" "corpus/$t" "seeds/$t" -- -max_total_time=60 $extra
            echo "::endgroup::"
          done
      # A crash input is only reproducible if it survives the job.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ strategy.job-index }}
          path: ${{ matrix.dir }}/artifacts
          if-no-files-found: ignore

  # The sync server image is built (never pushed; Docker is not available on the
  # development machine, so this is the only place it runs) and smoke-tested with
  # the example config (M6, ADR-0044).
  server-image:
    name: Server image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t mosaic-server:ci .
      - name: Initialise and start with the example config
        run: |
          set -euo pipefail
          mkdir -p ci-data ci-config
          cp deploy/mosaic-server.example.toml ci-config/mosaic-server.toml
          # The image runs as a non-root user (uid 65532).
          sudo chown -R 65532:65532 ci-data
          docker run --rm -v "$PWD/ci-data:/data" -v "$PWD/ci-config:/config:ro" mosaic-server:ci init --config /config/mosaic-server.toml
          docker run --rm -v "$PWD/ci-config:/config:ro" mosaic-server:ci check-config --config /config/mosaic-server.toml
          docker run -d --name mosaic-ci -p 127.0.0.1:8743:8743 -v "$PWD/ci-data:/data" -v "$PWD/ci-config:/config:ro" mosaic-server:ci serve --config /config/mosaic-server.toml
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8743/v1/info; then echo; exit 0; fi
            sleep 1
          done
          docker logs mosaic-ci
          exit 1
      - name: Stop
        if: always()
        run: docker rm -f mosaic-ci || true

  rust-supply-chain:
    name: Rust supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      # Each fuzz crate has its own workspace and lockfile (libfuzzer-sys and
      # its build dependencies), which the checks above do not see.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/core/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/vault/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/totp/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/qr/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/generator/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/insights/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/import/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/ssh-agent/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/native-messaging/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/passkey/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/sync/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/server/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/cli/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: crates/origin/fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: apps/desktop/src-tauri/fuzz/Cargo.toml
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings
      - name: cargo audit (fuzz lockfiles)
        run: |
          set -euo pipefail
          for d in crates/core/fuzz crates/vault/fuzz crates/totp/fuzz crates/qr/fuzz crates/generator/fuzz \
                   crates/insights/fuzz crates/import/fuzz crates/ssh-agent/fuzz crates/native-messaging/fuzz crates/passkey/fuzz crates/sync/fuzz crates/server/fuzz crates/cli/fuzz crates/origin/fuzz apps/desktop/src-tauri/fuzz; do
            cargo audit --deny warnings -f "$d/Cargo.lock"
          done

  typescript:
    name: TypeScript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # No "audited", "bank-grade" and the other banned claims in shipped or user-facing text (M9).
      - run: node scripts/release/wording-check.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level low

  # The release scripts (checksums, minisign signing and verification) run against fixtures with
  # throw-away keys. Only when a pull request touches them or the release workflow.
  release-selftest:
    name: Release scripts self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Did the pull request touch the release scripts?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE" HEAD -- scripts/release .github/workflows/release.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install minisign (pinned version, logged)
        if: steps.changed.outputs.run == 'true'
        run: bash scripts/release/install-minisign.sh
      - name: Self-test
        if: steps.changed.outputs.run == 'true'
        run: bash scripts/release/selftest.sh
      - name: No Cargo features in the release build
        if: steps.changed.outputs.run == 'true'
        run: bash scripts/release/check-features.sh

  desktop-frontend:
    name: Desktop app, frontend (build, Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --project desktop
      - run: pnpm --filter @mosaic/desktop build
      - name: Install Chromium for Playwright
        run: pnpm --filter @mosaic/desktop exec playwright install --with-deps chromium
      # Mock-mode build served with the production CSP; axe in light and dark.
      - run: pnpm --filter @mosaic/desktop exec playwright test --workers=1

  extension:
    name: Browser extension (build, dist check, Playwright hostile pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project extension
      # The production packages (chromium, firefox), then the checks on what ships.
      - run: pnpm --filter @mosaic/extension build
      - run: node apps/extension/scripts/check-dist.mjs
      - name: Install Chromium for Playwright
        run: pnpm --filter @mosaic/extension exec playwright install --with-deps chromium
      # The e2e build carries the test hooks and the `*.test` host access; the
      # hostile-site server and the fake desktop start from the fixtures. Chromium
      # runs headless with the extension loaded, so no display server is needed.
      - run: pnpm --filter @mosaic/extension build:e2e
      - run: pnpm --filter @mosaic/extension exec playwright test
