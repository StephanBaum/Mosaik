[package]
name = "mosaic-desktop"
description = "Mosaic desktop app: the Tauri shell around the vault session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
default-run = "mosaic-desktop"

[lints]
workspace = true

[lib]
name = "mosaic_desktop"
path = "src/lib.rs"

[[bin]]
name = "mosaic-desktop"
path = "src/main.rs"

[features]
# Set by `tauri build` (and `pnpm tauri build`): serve the bundled frontend
# through the custom protocol instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
# PREVIEW builds only (ADR-0153): the native host also accepts the dev extension ID in a release
# build, the window says "Preview", and an unpacked install registers the host for the user at
# start. check-features.sh and release.yml refuse it in a release.
preview = ["mosaic-native-messaging/preview"]

[dependencies]
getrandom.workspace = true
mosaic-core = { path = "../../../crates/core" }
mosaic-generator = { path = "../../../crates/generator" }
mosaic-import = { path = "../../../crates/import" }
mosaic-insights = { path = "../../../crates/insights" }
mosaic-native-messaging = { path = "../../../crates/native-messaging" }
mosaic-origin = { path = "../../../crates/origin" }
mosaic-passkey = { path = "../../../crates/passkey" }
# The OS keystore, the clipboard backend and the data paths, shared with the CLI (M8).
mosaic-platform = { path = "../../../crates/platform" }
mosaic-qr = { path = "../../../crates/qr" }
mosaic-ssh-agent = { path = "../../../crates/ssh-agent" }
# Sync: the engine, the folder backend and the hosted client (M6); `http` is the hosted backend.
mosaic-sync = { path = "../../../crates/sync", features = ["http"] }
mosaic-totp = { path = "../../../crates/totp" }
mosaic-vault = { path = "../../../crates/vault" }
# The system browser for the security-key handoff page (ADR-0077): the Tauri opener plugin is not
# in the tree, and the surface test keeps it out. Called from one place, with a URL Rust builds.
open = "=5.3.2"
pdf-writer.workspace = true
# The setup code QR for a phone (ADR-0096): Rust renders the module matrix, the webview draws it.
# Pinned by the workspace (ADR-0031), no new crate in the tree.
qrcodegen.workspace = true
rfd.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
thiserror.workspace = true
# The browser endpoint serves local connections on Tauri's async runtime
# (already in the tree through Tauri, mosaic-ssh-agent and mosaic-native-messaging).
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
win-screenshot.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true
security-framework-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
x11rb.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
mosaic-qr = { path = "../../../crates/qr", features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
# Passkey tests verify the signatures with the same crate that makes them
# (already in the tree through mosaic-passkey).
p256.workspace = true
# The sync tests run the real server on 127.0.0.1 (the loopback helper of the
# server's tests is included by path; already in the tree through mosaic-sync's tests).
mosaic-server = { path = "../../../crates/server" }
axum.workspace = true
tokio = { workspace = true, features = ["rt", "net", "macros"] }
# The mock runtime for the command and ACL wiring test.
tauri = { workspace = true, features = ["test"] }
