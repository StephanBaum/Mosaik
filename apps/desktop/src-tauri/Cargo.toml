[package]
name = "mosaic-desktop"
description = "Mosaic desktop app: the Tauri shell around the vault session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
default-run = "mosaic-desktop"

[lints]
workspace = true

[lib]
name = "mosaic_desktop"
path = "src/lib.rs"

[[bin]]
name = "mosaic-desktop"
path = "src/main.rs"

[features]
# Set by `tauri build` (and `pnpm tauri build`): serve the bundled frontend
# through the custom protocol instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
arboard = { workspace = true, features = ["image-data"] }
keyring.workspace = true
mosaic-core = { path = "../../../crates/core" }
mosaic-generator = { path = "../../../crates/generator" }
mosaic-import = { path = "../../../crates/import" }
mosaic-insights = { path = "../../../crates/insights" }
mosaic-qr = { path = "../../../crates/qr" }
mosaic-ssh-agent = { path = "../../../crates/ssh-agent" }
mosaic-totp = { path = "../../../crates/totp" }
mosaic-vault = { path = "../../../crates/vault" }
pdf-writer.workspace = true
rfd.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
subtle.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
win-screenshot.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true
security-framework-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
x11rb.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
mosaic-qr = { path = "../../../crates/qr", features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
# The mock runtime for the command and ACL wiring test.
tauri = { workspace = true, features = ["test"] }
