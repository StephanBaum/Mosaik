<!-- attempts: the site's own login page in a `sandbox="allow-scripts allow-forms"` frame (an opaque origin
     with the site's URL): a login typed and submitted there must not be offered as the site's. -->
<!doctype html>
<meta charset="utf-8">
<title>Sandboxed capture frame</title>
<iframe id="frame" sandbox="allow-scripts allow-forms" src="/login.html" width="400" height="200"></iframe>
