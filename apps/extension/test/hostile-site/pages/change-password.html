<!-- attempts: none. A password change form with autocomplete tokens: current, new and confirmation. Records a submit. -->
<!doctype html>
<meta charset="utf-8">
<title>Change password</title>
<script src="/_leaks.js"></script>
<form id="change" action="/never" onsubmit="window.__submitted = true; return false">
  <input id="user" name="username" type="text" autocomplete="username">
  <input id="current" name="current" type="password" autocomplete="current-password">
  <input id="new" name="new" type="password" autocomplete="new-password">
  <input id="confirm" name="confirm" type="password" autocomplete="new-password">
  <button type="submit">Change password</button>
</form>
