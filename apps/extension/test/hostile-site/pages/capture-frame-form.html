<!-- attempts: the frame half of capture-hidden-frame.html. A login form the page filled in itself,
     with a submit button, so a single user click on the button (seen or not) submits the page's login. -->
<!doctype html>
<meta charset="utf-8">
<title>Framed form</title>
<script src="/_leaks.js"></script>
<style>
  body { margin: 0; }
  button { display: block; width: 300px; height: 60px; margin-top: 8px; }
</style>
<form id="login" onsubmit="return false">
  <input id="user" name="username" type="text" autocomplete="username" value="victim@bank.test">
  <input id="pass" name="password" type="password" autocomplete="current-password" value="page-chosen-password">
  <button id="go" type="submit">Sign in</button>
</form>
