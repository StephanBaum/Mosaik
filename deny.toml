# cargo-deny policy. Every exception added here needs a comment and an entry in
# docs/DECISIONS.md or the commit message that introduced it.

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory, including unmaintained and yanked crates.
version = 2
yanked = "deny"
unmaintained = "all"
# Tauri's Linux backend (gtk-rs 0.18, webkit2gtk) and tauri-plugin-single-instance
# (zbus 5 on Linux) carry these. None is an exploitable vulnerability for Mosaic; each
# is reviewed in ADR-0019 and revisited when Tauri moves to gtk4 / zbus 6. Keep this
# list in sync with .cargo/audit.toml.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained: build-time proc-macro of glib-macros (gtk-rs 0.18, Linux only); ADR-0019" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6, no fix for zbus 5; via tauri-plugin-single-instance on Linux, and also a direct Linux dependency of mosaic-desktop (logind / screen-saver signals); ADR-0019" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6, no fix for zbus 5; via tauri-plugin-single-instance on Linux, and also a direct Linux dependency of mosaic-desktop (logind / screen-saver signals); ADR-0019" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing variability: reached only through elliptic-curve 0.13 (opaque-ke 4.0.1 and voprf 0.5.0, the OPAQUE login of the sync server and client, ADR-0046); the ristretto255 suite does every secret group and scalar operation in curve25519-dalek and never calls crypto-bigint arithmetic; opaque-ke 4.1 pre-releases still use elliptic-curve 0.13; revisit when opaque-ke moves to elliptic-curve 0.14. Also reached through passkey-auth 0.1.3 (p256 0.13, the sync server's WebAuthn relying party, ADR-0078): crypto-bigint runs inside ECDSA verification, whose inputs (public key, signature, message) are all public, so timing variability reveals nothing secret" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6, no fix for zbus 5; via tauri-plugin-single-instance on Linux, and also a direct Linux dependency of mosaic-desktop (logind / screen-saver signals); ADR-0019" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained: reached only through uniffi_bindgen -> askama, the Kotlin and Swift generator tool (feature `bindgen` of mosaic-mobile-ffi, built in CI to generate the bindings and never linked into a library or an app); revisit when uniffi_bindgen moves off askama's basic-toml; ADR-0089, M10 T1 probe (b)" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The allow-list is policy, not an inventory; unused entries are fine.
unused-allowed-license = "allow"
# Permissive licenses only. Copyleft or unusual licenses require an ADR.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
# libfuzzer-sys bundles LLVM's libFuzzer, which is under the permissive
# University of Illinois/NCSA license. It is only a dependency of the fuzz
# crate (crates/core/fuzz, checked with --manifest-path in CI) and is never
# linked into Mosaic. See ADR-0007 item 10.
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
    # CDLA-Permissive-2.0 (permissive data licence): the Mozilla root certificate list that
    # rustls-platform-verifier uses on wasm32 and in its own dev-dependencies (Linux reads the
    # system roots through rustls-native-certs). Data only, no code, no obligation on Mosaic's
    # code. ADR-0046 (T4 amendment, corrected in the review follow-ups).
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    # MPL-2.0 (file-level copyleft; unmodified crates only, no obligation on Mosaic's
    # own code): Tauri's HTML/CSS handling at build time (tauri-utils -> kuchikiki) and
    # the `dirs` stack's option-ext. ADR-0019.
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    # BSL-1.0 (Boost; permissive, OSI-approved, no notice needed in binaries): the
    # Windows clipboard backend of arboard (M3 shell, clipboard written from Rust).
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
    # MPL-2.0 (file-level copyleft; the crates are used unmodified, and the licence puts no
    # obligation on Mosaic's own code): UniFFI, the binding shell of the mobile apps
    # (crates/mobile-ffi only; uniffi_bindgen is the generator tool and not linked into the
    # libraries). `weedle2` is MIT. ADR-0089, M10 T1 probe (b).
    { crate = "uniffi", allow = ["MPL-2.0"] },
    { crate = "uniffi_bindgen", allow = ["MPL-2.0"] },
    { crate = "uniffi_core", allow = ["MPL-2.0"] },
    { crate = "uniffi_internal_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_meta", allow = ["MPL-2.0"] },
    { crate = "uniffi_pipeline", allow = ["MPL-2.0"] },
    { crate = "uniffi_udl", allow = ["MPL-2.0"] },
]

[licenses.private]
# Workspace crates are `publish = false`; their own license is an owner decision.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Crypto must come from the reviewed set in docs/CRYPTO_SPEC.md.
deny = [
    { name = "openssl", reason = "use rustls / RustCrypto; see CRYPTO_SPEC.md" },
    { name = "openssl-sys", reason = "use rustls / RustCrypto; see CRYPTO_SPEC.md" },
    { name = "rust-crypto", reason = "unmaintained" },
    { name = "sodiumoxide", reason = "unmaintained" },
    # ring is allowed only as the rustls provider (rustls with the `ring` feature, and
    # rustls-webpki, its certificate verifier); no other crate may link it. ADR-0046, ADR-0086.
    { name = "ring", wrappers = ["rustls", "rustls-webpki"], reason = "TLS provider of rustls only; crypto comes from the CRYPTO_SPEC.md set (ADR-0086)" },
    { name = "serde_cbor", reason = "unmaintained (RUSTSEC-2021-0127); WebAuthn CBOR is parsed by passkey-auth, passkeys by mosaic-passkey (ADR-0086)" },
    { name = "rsa", reason = "RUSTSEC-2023-0071 (Marvin attack), no fix; ADR-0078 admits passkey-auth because it has no rsa in its tree (ADR-0086)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
