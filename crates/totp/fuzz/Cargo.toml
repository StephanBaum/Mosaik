[package]
name = "mosaic-totp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the mosaic-totp parsers (nightly only)"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace (nightly-only, libFuzzer).
[workspace]
members = ["."]

[dependencies]
# libFuzzer bindings for cargo-fuzz; fuzz-only, never linked into Mosaic.
libfuzzer-sys = "=0.4.10"
mosaic-totp = { path = ".." }

[[bin]]
name = "otpauth_uri"
path = "fuzz_targets/otpauth_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "base32_secret"
path = "fuzz_targets/base32_secret.rs"
test = false
doc = false
bench = false
