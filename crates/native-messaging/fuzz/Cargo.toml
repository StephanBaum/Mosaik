[package]
name = "mosaic-native-messaging-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the mosaic-native-messaging envelope, pre-auth messages and channel frames (nightly only)"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace (nightly-only, libFuzzer).
# To check without cargo-fuzz: cargo check --manifest-path
# crates/native-messaging/fuzz/Cargo.toml --bins
[workspace]
members = ["."]

[lints.rust]
# CLAUDE.md: no unsafe code in any crate, the fuzz crates included.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
# libFuzzer bindings for cargo-fuzz; fuzz-only, never linked into Mosaic.
libfuzzer-sys = "=0.4.10"
mosaic-core = { path = "../../core" }
mosaic-native-messaging = { path = ".." }
# The same version and features as the main workspace.
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "float_roundtrip", "raw_value"] }

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "preauth_message"
path = "fuzz_targets/preauth_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "channel_open"
path = "fuzz_targets/channel_open.rs"
test = false
doc = false
bench = false
