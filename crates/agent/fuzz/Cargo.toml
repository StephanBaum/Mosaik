[package]
name = "mosaic-agent-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz target for the agent masking engine: stream output equals one-shot output for every split (nightly only)"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace (nightly-only, libFuzzer).
# To check without cargo-fuzz: cargo check --manifest-path
# crates/agent/fuzz/Cargo.toml --bins
[workspace]
members = ["."]

[lints.rust]
# CLAUDE.md: no unsafe code in any crate, the fuzz crates included.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
# libFuzzer bindings for cargo-fuzz; fuzz-only, never linked into Mosaic.
libfuzzer-sys = "=0.4.13"
mosaic-agent = { path = ".." }

[[bin]]
name = "masker"
path = "fuzz_targets/masker.rs"
test = false
doc = false
bench = false
