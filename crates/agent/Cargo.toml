[package]
name = "mosaic-agent"
description = "Mosaic agent access: bindings, masking, the request path, the policy engine and the agent wire protocol (ADR-0159, ADR-0160)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Test-only constructors and fixtures (a fixture CA for the HTTPS sender, a local TLS server).
# Debug builds only (see `src/lib.rs`).
test-util = []

[dependencies]
mosaic-core = { path = "../core" }
# Exact https destinations for bindings (ADR-0159).
mosaic-origin = { path = "../origin" }
# The binding digest is the SHA-256 of its canonical JSON (already in the tree through mosaic-core).
sha2.workspace = true
# The patterns and the stream carry are secrets (already in the tree through mosaic-core).
zeroize.workspace = true
thiserror.workspace = true
# Derive for the error codes and the wire types (the desktop crate enables the same feature).
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
# An independent base64 encoder to cross-check the masker patterns (already in the tree through mosaic-core).
base64ct = { workspace = true, features = ["alloc"] }
