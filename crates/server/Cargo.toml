[package]
name = "mosaic-server"
description = "Mosaic self-hostable sync server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "mosaic_server"
path = "src/lib.rs"

[[bin]]
name = "mosaic-server"
path = "src/main.rs"

[dependencies]
mosaic-core = { path = "../core" }
# validate_attachment_ciphertext: the same structural check the clients make.
mosaic-vault = { path = "../vault" }
# Wire formats, JSON types, email normalization and the OPAQUE ciphersuite.
mosaic-sync = { path = "../sync", features = ["opaque"] }
# TOTP verification with the replay guard (ADR-0008).
mosaic-totp = { path = "../totp" }
axum.workspace = true
tower-http.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
rusqlite.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
base64ct = { workspace = true, features = ["alloc"] }
# Server-side keys only (CRYPTO_SPEC section 2 primitives): HKDF for K_totp,
# HMAC for the pre-login fakes, SHA-256 for token and invite hashes,
# XChaCha20-Poly1305 for the TOTP secrets at rest.
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]

tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "test-util"] }
mosaic-sync = { path = "../sync", features = ["opaque", "test-util"] }
