[package]
name = "mosaic-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the mosaic-core decoders (nightly only)"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace (nightly-only, libFuzzer).
# Builds only with `--cfg fuzzing` (set by `cargo fuzz build` / `cargo fuzz
# run`); a plain `cargo check` stops with a compile_error! that says so. To
# check without cargo-fuzz: RUSTFLAGS="--cfg fuzzing" cargo check --bins.
[workspace]
members = ["."]

[lints.rust]
# CLAUDE.md: no unsafe code in any crate, the fuzz crates included.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
# libFuzzer bindings for cargo-fuzz; fuzz-only, never linked into Mosaic.
libfuzzer-sys = "=0.4.10"
mosaic-core = { path = ".." }

[[bin]]
name = "secret_key_parse"
path = "fuzz_targets/secret_key_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wrapped_key"
path = "fuzz_targets/wrapped_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "item_ciphertext"
path = "fuzz_targets/item_ciphertext.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attachment_open"
path = "fuzz_targets/attachment_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unpad"
path = "fuzz_targets/unpad.rs"
test = false
doc = false
bench = false

[[bin]]
name = "item_plaintext"
path = "fuzz_targets/item_plaintext.rs"
test = false
doc = false
bench = false

[[bin]]
name = "item_merge"
path = "fuzz_targets/item_merge.rs"
test = false
doc = false
bench = false
