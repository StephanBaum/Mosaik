[package]
name = "mosaic-cli"
description = "Mosaic command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Test backends for the integration tests: file-based keystore, session store and clipboard under
# `MOSAIC_TEST_DIR`, a scripted terminal and a settable clock. Debug builds only (see `src/testing.rs`).
test-util = []

[dependencies]
mosaic-core = { path = "../core" }
mosaic-vault = { path = "../vault" }
mosaic-import = { path = "../import" }
mosaic-sync = { path = "../sync", features = ["http"] }
mosaic-platform = { path = "../platform" }
mosaic-totp = { path = "../totp" }
mosaic-generator = { path = "../generator" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize.workspace = true
unicode-normalization.workspace = true
lexopt.workspace = true
rpassword.workspace = true
ctrlc.workspace = true
# Names a session slot by (account, install): the SHA-256 of the two IDs (already in the tree).
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# Safe `GetConsoleMode`/`SetConsoleMode` wrappers to restore the console input mode after a
# timed-out or interrupted no-echo prompt (already in the tree through same-file and walkdir).
winapi-util = "=0.1.11"

[dev-dependencies]
tempfile.workspace = true
mosaic-vault = { path = "../vault" }
# The hosted-flow tests run the real server on 127.0.0.1 (as the sync crate's HTTP tests do; the
# loopback harness is shared from `crates/server/tests/it/loopback.rs`): `mosaic-server` is the
# library under test on the other end, `axum` and `tokio` serve it from a thread of the test.
mosaic-server = { path = "../server" }
axum.workspace = true
tokio = { workspace = true, features = ["rt", "net", "macros"] }

[lib]
name = "mosaic_cli"
path = "src/lib.rs"

[[bin]]
name = "mosaic"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["test-util"]
