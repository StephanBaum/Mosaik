[package]
name = "mosaic-insights-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the mosaic-insights parsers (nightly only)"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace (nightly-only, libFuzzer).
# Builds only with `--cfg fuzzing` (set by `cargo fuzz build` / `cargo fuzz
# run`). To check without cargo-fuzz:
# RUSTFLAGS="--cfg fuzzing" cargo check --bins.
[workspace]
members = ["."]

[lints.rust]
# CLAUDE.md: no unsafe code in any crate, the fuzz crates included.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
# libFuzzer bindings for cargo-fuzz; fuzz-only, never linked into Mosaic.
libfuzzer-sys = "=0.4.10"
mosaic-insights = { path = ".." }

[[bin]]
name = "url_host"
path = "fuzz_targets/url_host.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strength"
path = "fuzz_targets/strength.rs"
test = false
doc = false
bench = false
