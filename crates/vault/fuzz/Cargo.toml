[package]
name = "mosaic-vault-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the mosaic-vault store decoders (nightly only)"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace (nightly-only, libFuzzer).
# `apply_remote` builds only with `--cfg fuzzing` (set by `cargo fuzz build` /
# `cargo fuzz run`); to check without cargo-fuzz:
# RUSTFLAGS="--cfg fuzzing" cargo check --bins.
[workspace]
members = ["."]

[lints.rust]
# CLAUDE.md: no unsafe code in any crate, the fuzz crates included.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
# libFuzzer bindings for cargo-fuzz; fuzz-only, never linked into Mosaic.
libfuzzer-sys = "=0.4.10"
mosaic-core = { path = "../../core" }
mosaic-vault = { path = ".." }

[[bin]]
name = "attachment_validate"
path = "fuzz_targets/attachment_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record_body"
path = "fuzz_targets/record_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apply_remote"
path = "fuzz_targets/apply_remote.rs"
test = false
doc = false
bench = false
