[package]
name = "mosaic-vault"
description = "Mosaic vault layer: offline-first local store of mosaic-core ciphertext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Test support for the simulations: `UnlockedSession::raise_epoch_to`
# (ADR-0064). Never enabled by an app.
test-util = []

[dependencies]
mosaic-core = { path = "../core" }
# Rotation: exact-origin matching of an open attempt and the breach-check types (M7b).
mosaic-insights = { path = "../insights" }
mosaic-origin = { path = "../origin" }
mosaic-totp = { path = "../totp" }
rusqlite.workspace = true
thiserror.workspace = true
zeroize.workspace = true
# Constant-time comparison of the boot marker (M10, CRYPTO_SPEC 6.9.2); already in the tree through mosaic-core.
subtle.workspace = true
# The encrypted export's plaintext schema (CRYPTO_SPEC 11.2), shared with the importer:
# derive for the typed items, base64url for attachment data (M8).
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
base64ct = { workspace = true, features = ["alloc"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
