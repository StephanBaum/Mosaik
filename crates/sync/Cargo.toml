[package]
name = "mosaic-sync"
description = "Mosaic sync: the wire formats of the hosted and folder backends, the transport trait and (later tracks) the sync engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# In-memory and chaos transports for the simulations (M6 T2).
test-util = []
# The OPAQUE ciphersuite module (`wire::opaque`, used by the server and the
# HTTP client; the `opaque-ke` dependency is admitted by ADR-0046).
opaque = ["dep:opaque-ke", "dep:sha2_0_10"]
# The HTTP transport (M6 T4); enables `opaque`. T1 has no reqwest code.
http = ["opaque"]

[dependencies]
mosaic-core = { path = "../core" }
mosaic-vault = { path = "../vault" }
# Derive for the JSON wire types of the hosted protocol.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Strict base64url (no padding) of the hosted JSON bytes.
base64ct = { workspace = true, features = ["alloc"] }
# SHA-256 of the checkpoint's seen state (CRYPTO_SPEC §10).
sha2.workspace = true
# NFC and IDNA of the sync account email, shared with the server.
unicode-normalization.workspace = true
idna.workspace = true
thiserror.workspace = true
# OPAQUE (CRYPTO_SPEC section 9.1, ADR-0046), only with feature `opaque`.
opaque-ke = { workspace = true, optional = true }
# SHA-512 of the TripleDH key exchange: opaque-ke 4.0 uses the digest 0.10 generation.
sha2_0_10 = { workspace = true, optional = true }
# Random temp file names of the folder transport, the retry jitter and
# opaque-ke's random number generator (ADR-0011).
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
# `O_NONBLOCK` for opening files in a folder anyone can write to: a FIFO
# planted on a segment name must not hang the reader. Already in the lock file
# (a dependency of getrandom and tempfile); this only adds the edge.
libc = "0.2"

[dev-dependencies]
# Temporary folders for the folder transport tests and simulations.
tempfile.workspace = true

# The integration tests need the simulation utilities.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["test-util"]
