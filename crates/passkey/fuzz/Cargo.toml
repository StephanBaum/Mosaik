[package]
name = "mosaic-passkey-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the mosaic-passkey base64url decoder and PKCS#8 key loader (nightly only)"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace (nightly-only, libFuzzer).
# To check without cargo-fuzz: cargo check --manifest-path
# crates/passkey/fuzz/Cargo.toml --bins
[workspace]
members = ["."]

[lints.rust]
# CLAUDE.md: no unsafe code in any crate, the fuzz crates included.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
# libFuzzer bindings for cargo-fuzz; fuzz-only, never linked into Mosaic.
libfuzzer-sys = "=0.4.10"
mosaic-passkey = { path = ".." }

[[bin]]
name = "b64url"
path = "fuzz_targets/b64url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pkcs8"
path = "fuzz_targets/pkcs8.rs"
test = false
doc = false
bench = false
