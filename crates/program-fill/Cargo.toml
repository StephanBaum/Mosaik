[package]
name = "mosaic-program-fill"
description = "Mosaic Windows program fill: program identity capture, binding policy and re-verification before every write (ADR-0157, ADR-0158)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The fake probe for other crates' tests. Never enabled in the app.
fake = []

[dependencies]
# Exact-origin rules: the winapp:// URLs, matching and exclusion classes (ADR-0158).
mosaic-origin = { path = "../origin" }
# The login URL type a binding is saved as.
mosaic-core = { path = "../core" }
# SHA-256 of a signer subject and of an unsigned image file.
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
