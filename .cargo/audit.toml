ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error (glib-macros, Linux)
    "RUSTSEC-2024-0429", # glib VariantStrIter (unused, Linux)
    "RUSTSEC-2026-0370", # zvariant (zbus 5, single-instance on Linux)
    "RUSTSEC-2026-0371", # zbus_names (zbus 5, single-instance on Linux)
    "RUSTSEC-2026-0372", # zvariant_derive (zbus 5, single-instance on Linux)
]
